<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b92b27"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#00f2fe" fill-opacity="0.3"/>
    </pattern>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pillGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes circuitStream {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillLag {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.15; }
      100% { transform: translateY(380px); opacity: 0; }
    }

    .bg-pulse {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: center;
    }
    .stream-line {
      stroke-dasharray: 60, 200;
      animation: circuitStream 7s linear infinite;
    }
    .stream-line-rev {
      stroke-dasharray: 40, 180;
      animation: circuitStream 9s linear infinite reverse;
    }
    .pill-motion-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .pill-motion-2 {
      animation: floatPillLag 6s ease-in-out infinite;
    }
    .scanner {
      animation: scanline 6s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
    .mono-text {
      font-family: "SF Mono", "Fira Code", Menlo, Consolas, Monaco, monospace;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#cyberGrid)"/>

  <!-- Dynamic Ambient Lighting Blobs in Background -->
  <circle cx="200" cy="180" r="160" fill="#00f2fe" opacity="0.12" filter="url(#glow)" class="bg-pulse"/>
  <circle cx="1000" cy="160" r="180" fill="#8b5cf6" opacity="0.1" filter="url(#glow)" class="bg-pulse" style="animation-delay: -3s;"/>
  <circle cx="600" cy="80" r="140" fill="#3b82f6" opacity="0.08" filter="url(#glow)" class="bg-pulse" style="animation-delay: -5s;"/>

  <!-- Scanning Line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#00f2fe" stroke-width="2" class="scanner" opacity="0.2"/>

  <!-- Animated Binary & Hex Circuit Paths -->
  <g opacity="0.4">
    <path d="M 50,70 L 250,70 L 320,140 L 520,140" fill="none" stroke="#00f2fe" stroke-width="1.5" class="stream-line"/>
    <path d="M 1150,290 L 980,290 L 910,220 L 720,220" fill="none" stroke="#8b5cf6" stroke-width="1.5" class="stream-line-rev"/>
    <path d="M 80,310 L 220,310 L 280,250 L 440,250" fill="none" stroke="#38bdf8" stroke-width="1" class="stream-line"/>
    <path d="M 1120,60 L 960,60 L 900,120 L 780,120" fill="none" stroke="#06b6d4" stroke-width="1" class="stream-line-rev"/>
  </g>

  <!-- Hex Assembly Visual Watermark Behind (Zero visual conflict) -->
  <g class="mono-text" font-size="12" fill="#334155" opacity="0.35" text-anchor="start">
    <text x="60" y="115">0x00401000: 55          push ebp</text>
    <text x="60" y="135">0x00401001: 89 e5       mov  ebp, esp</text>
    <text x="60" y="155">0x00401003: 83 ec 10    sub  esp, 0x10</text>
    <text x="60" y="175">0x00401006: 8b 45 08    mov  eax, [ebp+8]</text>
    <text x="60" y="195">0x00401009: 0f b6 00    movzx eax, byte ptr [eax]</text>

    <text x="960" y="115">0x004024a0: test rax, rax</text>
    <text x="960" y="135">0x004024a3: jz   0x00402510</text>
    <text x="960" y="155">0x004024a9: call sym.decompile</text>
    <text x="960" y="175">0x004024ae: mov  rdi, rbx</text>
    <text x="960" y="195">0x004024b1: ret</text>
  </g>

  <!-- Dynamic Floating Decorative Badges / Pills -->
  <g class="pill-motion-1">
    <g transform="translate(140, 260)" filter="url(#pillGlow)">
      <rect width="180" height="34" rx="17" fill="url(#badgeGrad)" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="20" cy="17" r="5" fill="#00f2fe"/>
      <text x="36" y="22" class="mono-text" font-size="12" font-weight="600" fill="#e2e8f0">⚡ DISASSEMBLY</text>
    </g>
  </g>

  <g class="pill-motion-2">
    <g transform="translate(880, 260)" filter="url(#pillGlow)">
      <rect width="190" height="34" rx="17" fill="url(#badgeGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="20" cy="17" r="5" fill="#a855f7"/>
      <text x="36" y="22" class="mono-text" font-size="12" font-weight="600" fill="#e2e8f0">🛡️ DECOMPILATION</text>
    </g>
  </g>

  <g class="pill-motion-1" style="animation-delay: -2.5s;">
    <g transform="translate(520, 275)" filter="url(#pillGlow)">
      <rect width="160" height="30" rx="15" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="18" cy="15" r="4" fill="#38bdf8"/>
      <text x="32" y="20" class="mono-text" font-size="11" font-weight="600" fill="#cbd5e1">🔬 SRE &amp; MALWARE</text>
    </g>
  </g>

  <!-- FOREGROUND: High Contrast Clear Typography Guaranteed In Front -->
  <g text-anchor="middle">
    <!-- Category Pill Tag -->
    <rect x="460" y="42" width="280" height="28" rx="14" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="600" y="61" class="mono-text" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CYBERSECURITY &amp; REVERSING</text>

    <!-- Main Title -->
    <text x="600" y="130" class="title-text" font-size="44" fill="#ffffff" filter="drop-shadow(0 4px 14px rgba(0,0,0,0.9))">
      Awesome Reverse Engineering
    </text>
    <text x="600" y="175" class="title-text" font-size="34" fill="url(#cyberCyan)" filter="drop-shadow(0 2px 10px rgba(0,242,254,0.3))">
      &amp; Binary Analysis Platforms
    </text>

    <!-- Subtitle -->
    <text x="600" y="225" class="sub-text" font-size="16" fill="#94a3b8" letter-spacing="0.2">
      Curated Commercial SaaS Solutions, SRE Frameworks &amp; Leading Open-Source Tooling
    </text>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="8" fill="none" stroke="#1e293b" stroke-width="1"/>
</svg>