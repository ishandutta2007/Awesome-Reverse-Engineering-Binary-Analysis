<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d14"/><stop offset="50%" stop-color="#0e1726"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="cyberCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="neonPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#b92b27"/><stop offset="100%" stop-color="#1565c0"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1f293d" stop-opacity=".8"/><stop offset="100%" stop-color="#111827" stop-opacity=".9"/></linearGradient><pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#00f2fe" fill-opacity=".3"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="pillGlow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#00f2fe" flood-opacity=".25" stdDeviation="6"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes circuitStream{0%{stroke-dashoffset:600}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes floatPillLag{0%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes scanline{0%{transform:translateY(-50px);opacity:0}50%{opacity:.15}}.bg-pulse{animation:pulseGlow 8s ease-in-out infinite;transform-origin:center}.stream-line{stroke-dasharray:60,200;animation:circuitStream 7s linear infinite}.stream-line-rev{stroke-dasharray:40,180;animation:circuitStream 9s linear infinite reverse}.pill-motion-1{animation:floatPill 5s ease-in-out infinite}.pill-motion-2{animation:floatPillLag 6s ease-in-out infinite}.scanner{animation:scanline 6s linear infinite}.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.sub-text{font-weight:400}.mono-text{font-family:&quot;SF Mono&quot;,&quot;Fira Code&quot;,Menlo,Consolas,Monaco,monospace}</style><rect width="1200" height="360" fill="url(#bgGrad)"/><rect width="1200" height="360" fill="url(#cyberGrid)"/><circle cx="200" cy="180" r="160" fill="#00f2fe" class="bg-pulse" filter="url(#glow)" opacity=".12"/><circle cx="1000" cy="160" r="180" fill="#8b5cf6" class="bg-pulse" filter="url(#glow)" opacity=".1" style="animation-delay:-3s"/><circle cx="600" cy="80" r="140" fill="#3b82f6" class="bg-pulse" filter="url(#glow)" opacity=".08" style="animation-delay:-5s"/><line x1="0" x2="1200" y1="0" y2="0" stroke="#00f2fe" stroke-width="2" class="scanner" opacity=".2"/><g opacity=".4"><path fill="none" stroke="#00f2fe" stroke-width="1.5" d="M 50,70 L 250,70 L 320,140 L 520,140" class="stream-line"/><path fill="none" stroke="#8b5cf6" stroke-width="1.5" d="M 1150,290 L 980,290 L 910,220 L 720,220" class="stream-line-rev"/><path fill="none" stroke="#38bdf8" stroke-width="1" d="M 80,310 L 220,310 L 280,250 L 440,250" class="stream-line"/><path fill="none" stroke="#06b6d4" stroke-width="1" d="M 1120,60 L 960,60 L 900,120 L 780,120" class="stream-line-rev"/></g><g fill="#334155" class="mono-text" font-size="12" opacity=".35" text-anchor="start"><text x="60" y="115">0x00401000: 55 push ebp</text><text x="60" y="135">0x00401001: 89 e5 mov ebp, esp</text><text x="60" y="155">0x00401003: 83 ec 10 sub esp, 0x10</text><text x="60" y="175">0x00401006: 8b 45 08 mov eax, [ebp+8]</text><text x="60" y="195">0x00401009: 0f b6 00 movzx eax, byte ptr [eax]</text><text x="960" y="115">0x004024a0: test rax, rax</text><text x="960" y="135">0x004024a3: jz 0x00402510</text><text x="960" y="155">0x004024a9: call sym.decompile</text><text x="960" y="175">0x004024ae: mov rdi, rbx</text><text x="960" y="195">0x004024b1: ret</text></g><g class="pill-motion-1"><g filter="url(#pillGlow)" transform="translate(140, 260)"><rect width="180" height="34" fill="url(#badgeGrad)" stroke="#00f2fe" stroke-opacity=".7" stroke-width="1.2" rx="17"/><circle cx="20" cy="17" r="5" fill="#00f2fe"/><text x="36" y="22" fill="#e2e8f0" class="mono-text" font-size="12" font-weight="600">⚡ DISASSEMBLY</text></g></g><g class="pill-motion-2"><g filter="url(#pillGlow)" transform="translate(880, 260)"><rect width="190" height="34" fill="url(#badgeGrad)" stroke="#a855f7" stroke-opacity=".7" stroke-width="1.2" rx="17"/><circle cx="20" cy="17" r="5" fill="#a855f7"/><text x="36" y="22" fill="#e2e8f0" class="mono-text" font-size="12" font-weight="600">🛡️ DECOMPILATION</text></g></g><g class="pill-motion-1" style="animation-delay:-2.5s"><g filter="url(#pillGlow)" transform="translate(520, 275)"><rect width="160" height="30" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1" rx="15"/><circle cx="18" cy="15" r="4" fill="#38bdf8"/><text x="32" y="20" fill="#cbd5e1" class="mono-text" font-size="11" font-weight="600">🔬 SRE &amp; MALWARE</text></g></g><g text-anchor="middle"><rect width="280" height="28" x="460" y="42" fill="#0f172a" stroke="#00f2fe" stroke-opacity=".8" stroke-width="1.2" rx="14"/><text x="600" y="61" fill="#38bdf8" class="mono-text" font-size="11" font-weight="700" letter-spacing="1.5">CYBERSECURITY &amp; REVERSING</text><text x="600" y="130" fill="#fff" class="title-text" filter="drop-shadow(0 4px 14px rgba(0,0,0,0.9))" font-size="44">Awesome Reverse Engineering</text><text x="600" y="175" fill="url(#cyberCyan)" class="title-text" filter="drop-shadow(0 2px 10px rgba(0,242,254,0.3))" font-size="34">&amp; Binary Analysis Platforms</text><text x="600" y="225" fill="#94a3b8" class="sub-text" font-size="16" letter-spacing=".2">Curated Commercial SaaS Solutions, SRE Frameworks &amp; Leading Open-Source Tooling</text></g><rect width="1199" height="359" x=".5" y=".5" fill="none" stroke="#1e293b" stroke-width="1" rx="8"/></svg>